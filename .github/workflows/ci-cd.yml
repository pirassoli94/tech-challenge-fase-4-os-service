name: CI-CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: os_service_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: os_service_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Criar schema de teste
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d os_service_test_db <<'SQL'
          CREATE TABLE IF NOT EXISTS ordens (
            id SERIAL PRIMARY KEY,
            cliente VARCHAR(255) NOT NULL,
            veiculo VARCHAR(255) NOT NULL,
            problema TEXT NOT NULL,
            status VARCHAR(50) NOT NULL DEFAULT 'ABERTA'
          );
          SQL
      - run: npm run test:coverage -- --coverageThreshold='{"global":{"statements":80,"lines":80}}'
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-os-service
          path: coverage/
      - run: docker build -t os-service:${{ github.sha }} .


  deploy-kubernetes:
    name: Deploy Kubernetes Local
    needs: test-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64, local-k8s]
    permissions:
      contents: read

    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar ambiente
        run: |
          docker info --format '{{.OSType}}'
          if ($LASTEXITCODE -ne 0) { throw "Docker indisponivel" }

          kubectl config current-context
          if ($LASTEXITCODE -ne 0) { throw "Kubernetes indisponivel" }

          kubectl get deployment os-service -n tech-challenge
          if ($LASTEXITCODE -ne 0) { throw "Deployment nao encontrado" }

      - name: Construir imagem Docker
        run: |
          $imagem = "tech-challenge-fase-4-os-service:${{ github.sha }}"
          docker build -t $imagem .
          if ($LASTEXITCODE -ne 0) { throw "Falha ao construir imagem" }

          docker save -o os-service-deploy.tar $imagem
          if ($LASTEXITCODE -ne 0) { throw "Falha ao exportar imagem" }

          docker cp os-service-deploy.tar desktop-control-plane:/root/os-service-deploy.tar
          if ($LASTEXITCODE -ne 0) { throw "Falha ao copiar imagem" }

          docker exec desktop-control-plane ctr -n k8s.io images import /root/os-service-deploy.tar
          if ($LASTEXITCODE -ne 0) { throw "Falha ao importar imagem" }

      - name: Atualizar OS Service
        run: |
          kubectl set image deployment/os-service "tech-challenge-fase-4-os-service=tech-challenge-fase-4-os-service:${{ github.sha }}" -n tech-challenge
          if ($LASTEXITCODE -ne 0) { throw "Falha ao atualizar OS Service" }

      - name: Verificar atualizacao
        run: |
          kubectl rollout status deployment/os-service -n tech-challenge --timeout=180s
          if ($LASTEXITCODE -ne 0) { throw "Falha no rollout do OS Service" }
