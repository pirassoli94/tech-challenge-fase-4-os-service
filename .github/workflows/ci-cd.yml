name: CI-CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: os_service_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: os_service_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Criar schema de teste
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d os_service_test_db <<'SQL'
          CREATE TABLE IF NOT EXISTS ordens (
            id SERIAL PRIMARY KEY,
            cliente VARCHAR(255) NOT NULL,
            veiculo VARCHAR(255) NOT NULL,
            problema TEXT NOT NULL,
            status VARCHAR(50) NOT NULL DEFAULT 'ABERTA'
          );
          SQL
      - run: npm run test:coverage -- --coverageThreshold='{"global":{"statements":80,"lines":80}}'
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-os-service
          path: coverage/
      - run: docker build -t os-service:${{ github.sha }} .

  deploy-kubernetes:
    name: Deploy Kubernetes
    needs: test-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuraÃ§Ã£o Kubernetes
        id: kube-check
        shell: bash
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG nÃ£o configurado. Deploy ignorado."
          fi

      - name: Configurar kubectl
        if: steps.kube-check.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config

      - name: Aplicar manifestos
        if: steps.kube-check.outputs.configured == 'true'
        run: kubectl apply -f k8s/

      - name: Validar rollout
        if: steps.kube-check.outputs.configured == 'true'
        run: kubectl rollout status deployment/os-service --timeout=120s

